[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elder-guardian-model"
version = "0.1.0"
description = "Leakage-safe E2SFCA/Gini screening model for Seoul senior leisure facilities"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

